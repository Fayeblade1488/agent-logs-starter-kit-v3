# AI Instructions for Agent Logs Starter Kit
# This file provides structured, machine-readable instructions for an AI agent.
# It details the repository's purpose, platform-specific prerequisites,
# setup commands, and a comprehensive list of available actions with examples.

repository_purpose: "A universal, cross-platform logging system for AI agents. This starter kit provides a robust and universal logging scaffold for AI agents. Capturing AI interactions is crucial for traceability, auditability, and continuity. This system is designed to be simple, machine-readable, and extensible."

conceptual_guide: "For a deeper, more conceptual understanding of this repository and the philosophy behind logging, please read the guide at docs/AI_Guide.md. It is highly recommended that you read this guide before you begin."

platforms:
  - "macOS"
  - "Linux"
  - "Windows"

prerequisites:
  macos: "make"
  linux: "make"
  windows: "PowerShell 7+"

setup:
  macos:
    description: "Create all necessary log directories on macOS."
    command: "make -f Makefile.macos create_log_dirs"
  linux:
    description: "Create all necessary log directories on Linux."
    command: "make -f Makefile.linux create_log_dirs"
  windows:
    description: "Create all necessary log directories on Windows."
    command: "pwsh -File .\\AgentLogs.ps1 New-LogDirs"

actions:
  - name: "create_daily_log"
    description: "Create a new daily log for summarizing daily activities."
    examples:
      macos: "make -f Makefile.macos create_daily_log"
      linux: "make -f Makefile.linux create_daily_log"
      windows: "pwsh -File .\\AgentLogs.ps1 New-DailyLog"
  - name: "create_incident_log"
    description: "Create a new incident report to document an error or unexpected event."
    examples:
      macos: "make -f Makefile.macos create_incident_log"
      linux: "make -f Makefile.linux create_incident_log"
      windows: "pwsh -File .\\AgentLogs.ps1 New-IncidentLog"
  - name: "create_change_log"
    description: "Create a new change log to document a modification to the system."
    examples:
      macos: "make -f Makefile.macos create_change_log"
      linux: "make -f Makefile.linux create_change_log"
      windows: "pwsh -File .\\AgentLogs.ps1 New-ChangeLog"
  - name: "create_success_log"
    description: "Create a new success report to document a positive outcome."
    examples:
      macos: "make -f Makefile.macos create_success_log"
      linux: "make -f Makefile.linux create_success_log"
      windows: "pwsh -File .\\AgentLogs.ps1 New-SuccessLog"
  - name: "create_note_log"
    description: "Create a new general-purpose note."
    examples:
      macos: "make -f Makefile.macos create_note_log"
      linux: "make -f Makefile.linux create_note_log"
      windows: "pwsh -File .\\AgentLogs.ps1 New-NoteLog"
  - name: "list_logs"
    description: "List all existing log files, organized by category."
    examples:
      macos: "make -f Makefile.macos list_logs"
      linux: "make -f Makefile.linux list_logs"
      windows: "pwsh -File .\\AgentLogs.ps1 Get-Logs"
  - name: "backup_logs"
    description: "Create a compressed archive of all logs and project files."
    examples:
      macos: "make -f Makefile.macos backup_logs"
      linux: "make -f Makefile.linux backup_logs"
      windows: "pwsh -File .\\AgentLogs.ps1 Backup-Logs"
  - name: "clean_old_logs_dry_run"
    description: "Perform a dry run to see which logs older than 30 days would be removed."
    examples:
      macos: "make -f Makefile.macos clean_old_logs"
      linux: "make -f Makefile.linux clean_old_logs"
      windows: "pwsh -File .\\AgentLogs.ps1 Remove-OldLogs -DryRun"
  - name: "clean_old_logs_execute"
    description: "Permanently delete all logs older than 30 days."
    examples:
      macos: "make -f Makefile.macos clean_old_logs_execute"
      linux: "make -f Makefile.linux clean_old_logs_execute"
      windows: "pwsh -File .\\AgentLogs.ps1 Remove-OldLogs"
